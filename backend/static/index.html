<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的财务看板</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>我的财务看板</h1>
      <div class="sub" id="period">加载中…</div>
    </header>

    <div class="health" id="health"></div>

    <div class="btns" style="margin-bottom:14px">
      <a class="btn primary" href="/upload">📷 拍图 / 传图 记账</a>
    </div>

    <div class="cards" id="cards"></div>

    <div class="section">
      <div class="sec-head">
        <h2>收支趋势</h2>
        <div class="range" id="range">
          <button data-r="daily">日</button>
          <button data-r="weekly">周</button>
          <button data-r="monthly" class="active">月</button>
          <button data-r="all">全部</button>
        </div>
      </div>
      <div class="chart"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="section">
      <h2>成本分类占比</h2>
      <div id="catWrap"><div class="chart"><canvas id="catChart"></canvas></div></div>
    </div>

    <div class="section">
      <h2>利润表（按项目）</h2>
      <div id="pnl"></div>
    </div>

    <div class="section">
      <h2>录入明细</h2>
      <div id="entries"></div>
    </div>

    <div class="section">
      <h2>导出</h2>
      <div class="btns">
        <a class="btn primary" id="btnExcel" href="#">导出 Excel</a>
        <a class="btn" id="btnPdf" href="#">导出 PDF</a>
      </div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <h3>修改这笔账</h3>
      <label>日期<input id="f_date" type="date" /></label>
      <label>类型
        <select id="f_type"><option>收入</option><option>成本</option></select>
      </label>
      <label>渠道<input id="f_channel" type="text" placeholder="微信 / 支付宝 / 淘宝 / 1688 / 美团" /></label>
      <label>分类<input id="f_category" type="text" placeholder="如 食材采购 / 物料 / 打车费" /></label>
      <label>名称<input id="f_item" type="text" placeholder="商品名 / 摘要" /></label>
      <label>项目<input id="f_project" type="text" placeholder="如 烤肉店 / 课程" /></label>
      <label>时间<input id="f_time" type="time" /></label>
      <label>金额<input id="f_amount" type="number" step="0.01" /></label>
      <label>单位<input id="f_unit" type="text" placeholder="斤/件/箱" /></label>
      <label>数量<input id="f_quantity" type="text" placeholder="如 5" /></label>
      <label>商户/对方<input id="f_merchant" type="text" /></label>
      <label>备注<input id="f_note" type="text" /></label>
      <div class="modal-btns">
        <button class="btn danger" id="btnDel">删除</button>
        <button class="btn" id="btnCancel">取消</button>
        <button class="btn primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
