<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>拍一张，自动记账</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="wrap">
    <a href="/" style="color:var(--accent);text-decoration:none;font-size:14px">← 返回看板</a>
    <header>
      <h1>拍一张，自动记账</h1>
      <div class="sub">自动认出：渠道 · 时间 · 类别 · 名称 · 数量 · 金额</div>
    </header>

    <div class="capture">
      <div class="cap-head">
        <span class="cap-t">这笔归到：</span>
        <div class="chips" id="projChips">
          <button class="chip" data-p="烤肉店">烤肉店</button>
          <button class="chip" data-p="课程">课程</button>
          <button class="chip" data-p="骑行">骑行</button>
          <button class="chip" data-p="其他">其他</button>
        </div>
      </div>
      <div class="cap-btns">
        <button class="btn primary" id="btnCam">📷 拍照</button>
        <button class="btn" id="btnPick">🖼 相册（可多选）</button>
      </div>
      <input id="fCam" type="file" accept="image/*" capture="environment" hidden />
      <input id="fPick" type="file" accept="image/*" multiple hidden />
      <div id="status" class="status" hidden></div>
      <div id="results"></div>
    </div>

    <div class="empty">认错了不用重传 —— 结果里直接改，改完点「保存修改」。</div>
  </div>
  <script src="/static/upload.js"></script>
</body>
</html>
